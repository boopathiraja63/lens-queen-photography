<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Customer Frame Works | Lens Queen Photo Frames</title>
<link rel="stylesheet" href="style.css">
<style>
.gallery-page{background:#070707;color:#fff;min-height:100vh}
.gallery-head{max-width:1200px;margin:auto;padding:28px 18px 10px;text-align:center}
.gallery-head h1{color:#e6c75e;margin:10px 0;font-size:clamp(28px,5vw,48px)}
.gallery-head p{color:#cfcfcf}
.back-home{display:inline-block;margin:8px 0 18px;padding:11px 18px;border:1px solid #cda93c;color:#e6c75e;text-decoration:none;border-radius:999px}
.works-grid{max-width:1200px;margin:auto;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.work-card{margin:0;background:#111;border:1px solid #493d18;padding:8px;border-radius:14px;overflow:hidden}
.work-card img{width:100%;height:430px;object-fit:cover;display:block;border-radius:9px}
@media(max-width:850px){.works-grid{grid-template-columns:repeat(2,1fr)}.work-card img{height:360px}}
@media(max-width:520px){.works-grid{grid-template-columns:1fr;gap:14px}.work-card img{height:auto}}
</style>
</head>
<body class="gallery-page">
<header class="gallery-head">
<a class="back-home" href="index.html">← HOME</a>
